name: Build APK

# Runs on every push/PR to main, and can also be triggered manually
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project doesn't ship a Gradle wrapper jar, so we let this
      # action install Gradle itself and cache dependencies between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfs-payment-logger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
